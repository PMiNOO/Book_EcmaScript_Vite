<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>도서 관리 시스템</title>
  </head>
  <body>
    <div id="app">
        <h1>도서 관리 시스템</h1>

        <div class="form-container">
            <h2>도서 등록</h2>
            <form id="bookForm">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="title">제목</label>
                        <input type="text" id="title" name="title" placeholder="도서 제목을 입력하세요." required>
                    </div>
                    <div class="form-group">
                        <label for="author">저자</label>
                        <input type="text" id="author" name="author" placeholder="저자를 입력하세요." required>
                    </div>
                    <div class="form-group">
                        <label for="isbn">ISBN</label>
                        <input type="text" id="isbn" name="isbn" placeholder="ISBN을 입력하세요. 예: 978-0132350884" required>
                    </div>
                    <div class="form-group">
                        <label for="price">가격</label>
                        <input type="number" id="price" name="price" placeholder="가격을 입력하세요.">
                    </div>
                    <div class="form-group">
                        <label for="publishDate">출판일</label>
                        <input type="date" id="publishDate" name="publishDate">
                    </div>
                    <div class="form-group">
                        <label for="language">언어</label>
                        <input type="text" id="language" name="language" placeholder="언어를 입력하세요.">
                    </div>
                    <div class="form-group">
                        <label for="pageCount">페이지 수</label>
                        <input type="number" id="pageCount" name="pageCount" placeholder="페이지 수를 입력하세요.">
                    </div>
                    <div class="form-group">
                        <label for="publisher">출판사</label>
                        <input type="text" id="publisher" name="publisher" placeholder="출판사를 입력하세요.">
                    </div>
                    <div class="form-group">
                        <label for="coverImageUrl">표지 URL</label>
                        <input type="text" id="coverImageUrl" name="coverImageUrl" placeholder="표지 이미지 URL을 입력하세요.">
                    </div>
                    <div class="form-group">
                        <label for="edition">에디션</label>
                        <input type="text" id="edition" name="edition" placeholder="에디션을 입력하세요.">
                    </div>
                    <div class="form-group">
                        <label for="description">설명</label>
                        <textarea name="description" placeholder="설명을 입력하세요." rows="4" cols="50"></textarea>
                    </div>
                </div>

                <span id="formError" class="error-message"></span>

                <div class="button-group">
                    <button type="submit">도서 등록</button>
                    <button type="button" class="cancel-btn" style="display: none;">취소</button>
                </div>
            </form>
        </div>

        <div class="table-container fade-in">
            <h2>도서 목록</h2>
            <table>
                <thead>
                    <tr>
                        <th>제목</th>
                        <th>저자</th>
                        <th>ISBN</th>
                        <th>가격</th>
                        <th>출판일</th>
                        <th>설명</th>
                        <th>액션</th>
                    </tr>
                </thead>
                <tbody id="bookTableBody">
                    </tbody>
            </table>
        </div>

    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
